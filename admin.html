<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Painel — FJU Olímpia</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f7ff">
  <link rel="icon" href="img/logo-tema-claro.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/painel.css">
  <script src="js/tema.js"></script>
</head>
<body>
  <!-- Login -->
  <div id="tela-login" hidden>
    <header class="topo compacto">
      <div class="barra">
        <span class="marca">
          <img class="logo-claro" src="img/logo-tema-claro.png" alt="FJU — Força Jovem Universal">
          <img class="logo-escuro" src="img/logo-tema-escuro.png" alt="FJU — Força Jovem Universal">
          <span class="cidade">Olímpia</span>
        </span>
        <button id="trocar-tema" class="trocar-tema" type="button" aria-label="Trocar tema">🌙</button>
      </div>
      <div class="hero">
        <span class="pill">🔒 Área da equipe</span>
        <h1>Painel de <em>jovens</em></h1>
      </div>
    </header>
    <main class="login">
      <form id="form-login" class="cartao">
        <div class="secao-titulo">
          <span class="passo">🔑</span>
          <div><h2>Entrar</h2><p>Use o login criado no Supabase</p></div>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" type="password" autocomplete="current-password" required>
        </div>
        <div id="erro-login" class="erro oculto" role="alert"></div>
        <button class="botao cheio" type="submit">Entrar</button>
      </form>
    </main>
    <footer class="rodape"><a href="index.html">Ir para o formulário de cadastro</a></footer>
  </div>

  <!-- App -->
  <div id="tela-app" hidden>
    <header class="app-topo">
      <a class="marca" href="#/">
        <img class="logo-claro" src="img/logo-tema-claro.png" alt="FJU — Força Jovem Universal">
        <img class="logo-escuro" src="img/logo-tema-escuro.png" alt="FJU — Força Jovem Universal">
        <span class="cidade">Olímpia</span>
      </a>
      <div style="display:flex; gap:6px; align-items:center">
        <button id="trocar-tema-app" class="trocar-tema" type="button" aria-label="Trocar tema">🌙</button>
        <button id="sair" class="botao secundario pequeno" type="button">Sair</button>
      </div>
    </header>

    <div id="sem-permissao" class="pagina" hidden>
      <div class="aviso">
        Sua conta entrou, mas ainda não está na lista de administradores.
        Peça para alguém rodar no Supabase: <code>insert into public.admins (email) values ('seu-email');</code>
      </div>
    </div>

    <main id="app"></main>

    <nav class="nav-inferior" aria-label="Menu principal">
      <a href="#/" data-secao="inicio"></a>
      <a href="#/jovens" data-secao="jovens"></a>
      <a href="#/torneios" data-secao="torneios"></a>
      <a href="index.html#cadastrar" data-secao="cadastrar"></a>
    </nav>
  </div>

  <div id="sheet-fundo" class="sheet-fundo" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
  <div id="aviso" class="aviso-flutuante" role="status" hidden></div>

  <script type="module" src="js/painel/app.js"></script>
</body>
</html>
